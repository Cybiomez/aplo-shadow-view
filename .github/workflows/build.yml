name: build

# Сборка переносимых бинарников под Windows и Linux по пушу тега v* с публикацией
# в GitHub Release. Тег с дефисом (v0.2.0-dev.1) → pre-release (канал dev);
# тег без дефиса → стабильный релиз (канал latest).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # создание релиза и загрузка артефактов

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: AploShadowView-windows.exe
            binary: dist/AploShadowView.exe
          - os: ubuntu-latest
            artifact: AploShadowView-linux
            binary: dist/AploShadowView
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # системные зависимости pywebview на Linux (WebKitGTK)
      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 libgirepository1.0-dev

      # сборка фронтенда
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # сборка бинарника
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller
      - name: PyInstaller
        run: pyinstaller build/aplo-shadow-view.spec
      - name: Rename artifact
        shell: bash
        run: mv "${{ matrix.binary }}" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }} # тег с дефисом → pre-release
          files: artifacts/**/*
